<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School+ — Lycée Bilingue de Nkoabang</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f8f4;
      color: #222;
    }

    header {
      background: #0b8f6a;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 18px;
      background: #0b8f6a;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #087556;
    }

    .hidden {
      display: none !important;
    }

    .error {
      color: #b00020;
      margin-top: 12px;
    }

    .success {
      background: #e8f8ee;
      padding: 12px;
      border-radius: 8px;
    }

    .lesson,
    .exercise {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 12px 0;
    }

    nav {
      margin-top: 15px;
    }

    nav button {
      background: white;
      color: #0b8f6a;
      margin: 4px;
    }

    .logout {
      background: #b00020;
    }

    .answer {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>School+ 📚</h1>
  <p>Lycée Bilingue de Nkoabang</p>

  <nav id="nav" class="hidden">
    <button onclick="showPage('home')">Accueil</button>
    <button onclick="showPage('lessons')">Cours</button>
    <button onclick="showPage('exercises')">Exercices</button>
    <button onclick="logout()" class="logout">Déconnexion</button>
  </nav>
</header>

<main>

  <!-- CONNEXION -->
  <section id="login" class="card">
    <h2>🔐 Connexion</h2>

    <form id="loginForm">
      <input
        id="user"
        type="text"
        placeholder="Nom d'utilisateur"
        value="eleve"
        required
      >

      <input
        id="pass"
        type="password"
        placeholder="Mot de passe"
        value="1234"
        required
      >

      <button type="submit">Se connecter</button>
    </form>

    <p id="loginMessage"></p>

    <p>
      Compte de démonstration :
      <b>eleve</b> / <b>1234</b>
    </p>
  </section>

  <!-- APPLICATION -->
  <section id="app" class="hidden">

    <!-- ACCUEIL -->
    <div id="home" class="card">
      <h2>Bienvenue sur School+ 👋</h2>
      <p id="welcome"></p>

      <div class="success">
        <b>📚 Ta plateforme scolaire</b>
        <p>
          Consulte tes cours et entraîne-toi avec les exercices.
        </p>
      </div>
    </div>

    <!-- COURS -->
    <div id="lessons" class="card hidden">
      <h2>📖 Mes cours</h2>
      <div id="lessonsList">Chargement...</div>
    </div>

    <!-- EXERCICES -->
    <div id="exercises" class="card hidden">
      <h2>✏️ Mes exercices</h2>
      <div id="exercisesList">Chargement...</div>
    </div>

  </section>

</main>

<script>
  let currentUser = null;

  const loginForm = document.getElementById("loginForm");

  loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("user").value.trim();
    const password = document.getElementById("pass").value;

    const message = document.getElementById("loginMessage");

    message.textContent = "Connexion en cours...";
    message.className = "";

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: username,
          password: password
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        message.textContent =
          data.message || "Nom d'utilisateur ou mot de passe incorrect.";
        message.className = "error";
        return;
      }

      currentUser = data.user;

      document.getElementById("login").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("nav").classList.remove("hidden");

      document.getElementById("welcome").textContent =
        "Bonjour " + currentUser.name + " ! Classe : " +
        (currentUser.class_name || "Non définie");

      await loadLessons();
      await loadExercises();

      showPage("home");

    } catch (error) {
      console.error(error);

      message.textContent =
        "Impossible de contacter le serveur. Réessaie.";
      message.className = "error";
    }
  });

  async function loadLessons() {
    const container = document.getElementById("lessonsList");

    try {
      const response = await fetch("/api/lessons");
      const lessons = await response.json();

      container.innerHTML = "";

      if (!lessons.length) {
        container.innerHTML = "<p>Aucun cours disponible.</p>";
        return;
      }

      lessons.forEach(function(lesson) {
        const div = document.createElement("div");
        div.className = "lesson";

        div.innerHTML = `
          <h3>${escapeHtml(lesson.title)}</h3>
          <p>${escapeHtml(lesson.content)}</p>
          <small>Classe : ${escapeHtml(lesson.class_name || "")}</small>
        `;

        container.appendChild(div);
      });

    } catch (error) {
      container.innerHTML =
        "<p class='error'>Impossible de charger les cours.</p>";
    }
  }

  async function loadExercises() {
    const container = document.getElementById("exercisesList");

    try {
      const response = await fetch("/api/exercises");
      const exercises = await response.json();

      container.innerHTML = "";

      if (!exercises.length) {
        container.innerHTML = "<p>Aucun exercice disponible.</p>";
        return;
      }

      exercises.forEach(function(exercise) {
        const div = document.createElement("div");
        div.className = "exercise";

        div.innerHTML = `
          <h3>${escapeHtml(exercise.title)}</h3>
          <p><b>${escapeHtml(exercise.question)}</b></p>

          <input
            class="answer"
            id="answer-${exercise.id}"
            placeholder="Ta réponse"
          >

          <button onclick="submitExercise(${exercise.id})">
            Vérifier
          </button>

          <p id="result-${exercise.id}"></p>
        `;

        container.appendChild(div);
      });

    } catch (error) {
      container.innerHTML =
        "<p class='error'>Impossible de charger les exercices.</p>";
    }
  }

  async function submitExercise(id) {
    const input = document.getElementById("answer-" + id);
    const result = document.getElementById("result-" + id);

    const answer = input.value.trim();

    if (!answer) {
      result.textContent = "Entre une réponse.";
      result.className = "error";
      return;
    }

    try {
      const response = await fetch("/api/exercises/" + id + "/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          userId: currentUser.id,
          answer: answer
        })
      });

      const data = await response.json();

      if (data.correct) {
        result.textContent = "✅ Bonne réponse !";
        result.className = "success";
      } else {
        result.textContent = "❌ Mauvaise réponse.";
        result.className = "error";
      }

    } catch (error) {
      result.textContent = "Erreur de connexion.";
      result.className = "error";
    }
  }

  function showPage(page) {
    document.getElementById("home").classList.add("hidden");
    document.getElementById("lessons").classList.add("hidden");
    document.getElementById("exercises").classList.add("hidden");

    document.getElementById(page).classList.remove("hidden");
  }

  function logout() {
    currentUser = null;

    document.getElementById("app").classList.add("hidden");
    document.getElementById("nav").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");

    document.getElementById("user").value = "eleve";
    document.getElementById("pass").value = "1234";
    document.getElementById("loginMessage").textContent = "";
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text ?? "";
    return div.innerHTML;
  }
</script>

</body>
  </html>
